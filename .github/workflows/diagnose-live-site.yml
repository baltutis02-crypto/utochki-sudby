name: Diagnose live site

on:
  push:
    branches: [diag-site]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Route and asset diagnostics
        run: |
          set +e
          BASE="https://utochki-sudby.ru"
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.6 Mobile/15E148 Safari/604.1'

          echo "=== ROUTES ==="
          for p in / /razbory /razbory/natalnaya-karta /razbory/saju /razbory/konkretnyy-vopros /offer /privacy /cabinet; do
            code=$(curl -ksS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$p")
            echo "$p -> $code"
          done

          echo
          echo "=== IOS SAFARI ROOT ==="
          curl -ksS -A "$UA" -D - -o /tmp/root.html --max-time 20 "$BASE/" | sed -n '1,30p'
          echo "body-bytes: $(wc -c < /tmp/root.html)"
          grep -o 'data-dpl-id="[^"]*"' /tmp/root.html | head -1
          grep -o '/_next/static/immutable/chunks/[^" ]*' /tmp/root.html | sort -u > /tmp/assets.txt

          echo
          echo "=== NEXT ASSETS ==="
          while read -r asset; do
            code=$(curl -ksS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$asset")
            bytes=$(curl -ksS -o /dev/null -w "%{size_download}" --max-time 20 "$BASE$asset")
            echo "$code $bytes $asset"
          done < /tmp/assets.txt

          echo
          echo "=== CACHE BYPASS ==="
          curl -ksS -D - -o /dev/null --max-time 20 "$BASE/?diag=$(date +%s)" | grep -Ei 'HTTP/|server:|x-vercel-cache:|age:|etag:|x-vercel-id:'

          echo
          echo "=== DNS MULTI RESOLVER ==="
          for dns in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "@$dns"
            dig +short @$dns A utochki-sudby.ru
            dig +short @$dns CNAME www.utochki-sudby.ru
          done
